[tool_alias]
kubectx = "github:ahmetb/kubectx"
kubens = "github:ahmetb/kubectx"

# Personal tools - work-specific tools should be added per-machine
[tools]
# Shell & prompt
"github:starship/starship" = "latest"
atuin = "latest"
direnv = "latest"

# Editors & terminal
neovim = "latest"
tmux = "latest"
zellij = "latest"

# CLI essentials
eza = "latest"
fzf = "latest"
fd = "latest"
rg = "latest"
jq = "latest"
yq = "latest"
lazygit = "latest"
watchexec = "latest"

# Dev tools
gh = "latest"
go = "latest"
node = "latest"
npm = "latest"
python = "latest"
rust = "stable"

# AI tools
chezmoi = "latest"
# claude-code and codex installed separately

# Infra (optional, common across jobs)
kubectl = "1.35"
k9s = "latest"
terraform = "latest"
opentofu = "latest"
talosctl = "1.12.2"
colima = "latest"
gcloud = "latest"
flux2 = "2.6.4"
stern = "latest"
"aqua:kubernetes-sigs/krew" = "latest"
opencode = "latest"
kustomize = "latest"
"github:vmware/pinniped" = "latest"
kubectx = "latest"
kubens = { version = "latest", asset_pattern = "kubens_*_darwin_arm64.tar.gz"}
kind = "latest"
glab = "latest"
"github:asciinema/asciinema" = "latest"
"github:NVIDIA/OpenShell" = "latest"
"gitlab:graphviz/graphviz" = "latest"
"github:nvidia-lpu/kubectl-vlogs" = "latest"
rclone = "latest"
"github:jj-vcs/jj" = "latest"
pandoc = "latest"
"npm:pyright" = "latest"
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"ubi:BLAKE3-team/BLAKE3" = { version = "latest", exe = "b3sum" }
vhs = "latest"
shellcheck = "latest"
dyff = "latest"
teleport-ent = "18"

# "aqua:kubernetes-sigs/krew" = "latest"
# "krew:view-secret" = "latest"
# "krew:foreach" = "latest"

[settings]
experimental = true
trusted_config_paths = [
  "/Users/aj/.codex/worktrees",
  "/Users/aj/dev/.codex/worktrees",
  "/Users/aj/dev/github/nvidia",
  "/Users/aj/dev/github/nvidia-lpu",
  "/Users/aj/dev/github/fujin",
  "/Users/aj/dev/gitlab/achristensen",
  "/Users/aj/nv",
  "/Users/aj/Developer",
  "/Users/aj/.local/share/chezmoi",
  "/Users/aj/tmp",
  "/Users/aj/nv/tmp",
]
